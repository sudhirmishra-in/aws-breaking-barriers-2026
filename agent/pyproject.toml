[project]
name = "ftusa-exchange-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["strands-agents", "bedrock-agentcore", "boto3", "pydantic>=2", "aws-opentelemetry-distro>=0.18.0"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
